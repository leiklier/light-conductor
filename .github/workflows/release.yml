# Release — publishes a GitHub release (creating its tag) for the version the
# repo is already bumped to. Dispatch-only: the operator (or an agent session
# with Actions access) picks the branch — normally main — and supplies the
# version; the run refuses anything that does not match the house release
# process (README "Releases & channels"): the tag must equal manifest.json's
# version, tags are immutable, and `-beta.N` versions publish as pre-releases
# that soak on the live install before being promoted unchanged to stable.
#
# Security posture: no third-party actions (only first-party actions/checkout);
# top-level permissions dropped to none, the single job holds contents: write
# only; workflow inputs reach shell steps via env, never inline interpolation.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, no leading v (e.g. 0.1.0-beta.19). Must match manifest.json on the selected branch."
        required: true
        type: string
      title:
        description: "Optional title suffix: 'door lighting toggle' publishes as 'v0.1.0-beta.19 — door lighting toggle'."
        required: false
        type: string
        default: ""
      notes:
        description: "Optional hand-written release notes; auto-generated from merged PRs when empty."
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag + release; nothing else
    steps:
      - uses: actions/checkout@v5

      - name: Validate version against the component
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::version '$VERSION' is not X.Y.Z or X.Y.Z-beta.N (no leading v)"
            exit 1
          fi
          manifest="$(jq -r .version custom_components/light_conductor/manifest.json)"
          if [[ "$manifest" != "$VERSION" ]]; then
            echo "::error::manifest.json is at $manifest, not $VERSION — bump the repo first (house process)"
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::tag v$VERSION already exists — tags are immutable, bump instead"
            exit 1
          fi

      - name: Create tag + release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          args=(--target "$GITHUB_SHA")
          if [[ -n "$TITLE" ]]; then
            args+=(--title "v$VERSION — $TITLE")
          else
            args+=(--title "v$VERSION")
          fi
          if [[ -n "$NOTES" ]]; then
            args+=(--notes "$NOTES")
          else
            args+=(--generate-notes)
          fi
          if [[ "$VERSION" == *-beta.* ]]; then
            args+=(--prerelease) # betas soak before promotion (README)
          fi
          gh release create "v$VERSION" "${args[@]}"
